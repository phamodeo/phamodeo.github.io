<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image — Pedro Amodeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Geist+Mono:wght@400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #282C34;
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .corner-tl {
      position: absolute;
      top: 40px;
      left: 52px;
      font-family: 'Geist Mono', monospace;
      font-size: 16px;
      color: #4E5560;
      letter-spacing: 0.05em;
    }

    .corner-br {
      position: absolute;
      bottom: 40px;
      right: 52px;
      font-family: 'Geist Mono', monospace;
      font-size: 16px;
      color: #4E5560;
      letter-spacing: 0.04em;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .name {
      font-family: 'Syne', sans-serif;
      font-size: 96px;
      font-weight: 800;
      color: #F7F5F8;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .title {
      font-family: 'DM Sans', sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #969EAA;
      letter-spacing: 0.01em;
    }

    .divider {
      width: 200px;
      height: 2px;
      background: #E489A0;
      margin: 32px 0;
    }

    .tagline {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #F7F5F8;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>

  <span class="corner-tl">// phamodeo.com.br</span>

  <div class="center">
    <h1 class="name">Pedro Amodeo</h1>
    <p class="title">Commerce Engineer @ VTEX</p>
    <div class="divider"></div>
    <p class="tagline">Translating Tech into Growth</p>
  </div>

  <span class="corner-br">~$16M GMV &nbsp;·&nbsp; 30 Enterprise Accounts</span>

</body>
</html>
