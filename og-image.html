<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image, Pedro Amodeo</title>
  <!--
    Source for og-image.png (1200x630). Rendered with headless Chrome:
    chrome --headless=new --window-size=1200,630 --screenshot=og-image.png og-image.html

    Sized for small previews: LinkedIn shows this at ~550px wide on the web
    and ~350px in the app (about 0.3x), so every text line is 36px or larger
    and only high-contrast colors are used.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #282C34;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 500px;
    }

    .text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 56px 0 76px;
    }

    .name {
      font-family: 'Sora', sans-serif;
      font-size: 84px;
      font-weight: 700;
      color: #F7F5F8;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .role {
      margin-top: 26px;
      font-family: 'DM Sans', sans-serif;
      font-size: 40px;
      font-weight: 500;
      color: #F7F5F8;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .divider {
      width: 96px;
      height: 6px;
      border-radius: 3px;
      background: #E489A0;
      margin: 40px 0 34px;
    }

    .tagline {
      font-family: 'Sora', sans-serif;
      font-size: 42px;
      font-weight: 600;
      color: #E489A0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .photo {
      width: 500px;
      height: 630px;
      object-fit: cover;
      object-position: 50% 35%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="text">
    <h1 class="name">Pedro Amodeo</h1>
    <p class="role">Customer Success Manager<br>at VTEX</p>
    <div class="divider"></div>
    <p class="tagline">Translating Tech<br>into Growth</p>
  </div>
  <img class="photo" src="img/pedro-amodeo.webp" alt="">
</body>
</html>
