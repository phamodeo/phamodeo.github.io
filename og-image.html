<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image — Pedro Amodeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0d1017;
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .corner-tl {
      position: absolute;
      top: 36px;
      left: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #555;
      letter-spacing: 0.04em;
    }

    .corner-br {
      position: absolute;
      bottom: 36px;
      right: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #555;
      letter-spacing: 0.04em;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .name {
      font-family: 'Manrope', sans-serif;
      font-size: 84px;
      font-weight: 800;
      color: #f2f2f2;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .title {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #aaa;
      letter-spacing: 0.01em;
    }

    .divider {
      width: 240px;
      height: 3px;
      background: #AAFF00;
      margin: 28px 0;
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 500;
      color: #f2f2f2;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>

  <span class="corner-tl">// phamodeo.com.br</span>

  <div class="center">
    <h1 class="name">Pedro Amodeo</h1>
    <p class="title">Commerce Engineer @ VTEX</p>
    <div class="divider"></div>
    <p class="tagline">Translating Tech into Growth</p>
  </div>

  <span class="corner-br">~$16M GMV · 30 Enterprise Accounts</span>

</body>
</html>
